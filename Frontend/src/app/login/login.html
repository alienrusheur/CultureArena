<div class="Pagedeconnexion">
    <div class="LogoApp">
        <img src="/image/CultureArena.png" alt="LogoDeLApp">
    </div>
    <div class="logoconnexion">
        <img src="/image/LogoPageDeConnexion.png" alt="Logo CultureArena">
    </div>
    <h1>Bienvenue !</h1>
    <p>Connecte toi à ton compte</p>
    <div class="Encadré">
        <div class="tabs">
            <button type="button" class="connexion" routerLink="/login">Connexion</button>
            <button type="button" class="Inscription" routerLink="/register">Inscription</button>
        </div>
        <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">

            <input
                type="email"
                id="email"
                name="email"
                class="input-email"
                placeholder="Adresse mail"
                [(ngModel)]="credentials.email"
                required>

            <input
                [type]="showPassword ? 'text' : 'password'"
                id="motDePasse"
                name="motDePasse"
                class="input-password"
                placeholder="Mot de passe"
                [(ngModel)]="credentials.motDePasse"
                required
                minlength="8">
            <p class="hint" id="hint" style="display:none;">8 caractères minimum</p>

            <div class="error" id="errorBox" *ngIf="errorMessage">{{ errorMessage }}</div>

            <div class="forgot" id="forgotRow">
                <a href="#" (click)="forgotPassword($event)">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="submit" id="submitBtn" [disabled]="isLoading">
                {{ isLoading ? 'Connexion...' : 'Se connecter' }}
            </button>

        </form>
        <div class="autremoyen">
            <hr class="ma-ligne">
            <span>Ou continue avec</span>
            <hr class="ma-ligne">
        </div>

        <div class="ConexionReseau">
            <button type="button" (click)="loginWith('google')"><img src="/image/Logo Google.png" alt="LogoGoogle">Google</button>
            <button type="button" (click)="loginWith('facebook')"><img src="/image/Logo Facebook.png" alt="LogoFacebook">Facebook</button>
        </div>

        <p class="pasdecompte">Pas de compte ? <a routerLink="/register">Inscris-toi !</a></p>
    </div>
</div>
